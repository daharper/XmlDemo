<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet"
          data-name="vs/editor/editor.main"
          href="./min/vs/editor/editor.main.css" />
    <style>
        html, body {
            height: 95%;                        
        }

        #container {
            height: 100%;            
        }
    </style>
</head>
<body style="margin: 2px; background-color: #1E1E1E;">
    <div id="container"></div>
    <script src="./min/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': './min/vs' } });
    </script>
    <script src="./min/vs/editor/editor.main.nls.js"></script>
    <script src="./min/vs/editor/editor.main.js"></script>
<script>
    var el = document.getElementById('container');
    var editor = null;
    var init = function () {

        require(['vs/editor/editor.main'], function () {

            editor = monaco.editor.create(el, {
                theme: 'vs-dark',
                model: monaco.editor.createModel("<greeting>Hello World</greeting>", "xml"),
                fontSize: 14,
                automaticLayout: true,
                stickyScroll: { enabled: false },
                wordWrap: 'on', 
                wrappingIndent: 'indent',
                wordWrapColumn: 100, 
                wrappingStrategy: 'advanced'                
            });

            editor.layout();
        });

        // no point in keeping this around.
        window.removeEventListener("load", init);
    };

    window.addEventListener("load", init);    

</script>
</body>
</html>
